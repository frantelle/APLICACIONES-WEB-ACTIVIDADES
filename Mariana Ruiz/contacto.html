<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <a href="./index.html">Volver a la página principal</a>
    <title>Contacto</title>
</head>
<body>
    <h1>Formulario de Contacto</h1>
    <h2>¿Te gustaría poner orden en las finanzas de tu negocio o coordinar una sesión de asesoría?</h2> 
    <p>Completa el siguiente formulario y me pondré en contacto contigo a la brevedad.</p>
    <!--Formulario-->
    <form action="./contacto.html" method="post">
        <!--
        Nombre 
        Apellido
        correo electronico
        telefono
        servicio de interes
        consulta
        boton de envio-->
        <label for="id-Nombre">Nombre</label>
        <input type="text" name="nombre" id="id-Nombre"> 
        <label for="id-Apellido">Apellido</label>
        <input type="text" name="Apellido" id="id-Apellido">
        <label for="id-correo">Correo electronico</label>
        <input type="email" name="Correo Electronico" id="id-correo">
        <label for="id-teléfono">Teléfono</label>
        <input type="tel" name="teléfono" id="id-teléfono">
        <label for="id-servicio">Servicio de interés</label>
        <select name="servicio" id="id-servicio">
            <option value="diagnóstico">Diagnostico financiero</option>
            <option value="planificacion">Planificacion de presupuesto</option>
            <option value="estrategia">Estrategia de precios</option>
            <option value="consulta">Consulta general</option>
        </select>
       <label for="id-consulta">Consulta</label>
       <textarea name="consulta" id="id-consulta" rows="4" cols="50" placeholder="Cuéntame brevemente sobre tu negocio o situación actual"></textarea>
 <!-- <input type="submit" value="Enviar"> -->
     <button type="submit">Enviar Mensaje</button>
    </form>
    <!--Fin del formulario-->
</body>
</html>
