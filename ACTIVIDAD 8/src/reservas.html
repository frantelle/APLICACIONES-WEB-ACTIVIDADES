<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <meta name="description" content="Reservá tu cabaña sustentable en San Javier, Traslasierras, Córdoba.">
    <link rel="stylesheet" href="./recursos/css/index.css">

    <!-- Esta página sigue el enfoque SPA: es la parte interactiva del sitio (fechas, validación, confirmación). -->
</head>
<body>

    <!-- Mismo header que index.html para mantener el layout. -->
    <header class="encabezado">
        <a href="./index.html" class="encabezado-logo">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Retiro Sustentable - Ir al inicio" width="180">
        </a>

        <nav class="menu-principal">
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./index.html#cabanas">Cabañas</a></li>
                <!-- aria-current marca la página actual para lectores de pantalla. -->
                <li><a href="./reservas.html" aria-current="page">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido-principal">
        <h1>Reservas</h1>
        <h2>Contactanos</h2>
        <p>Completá el formulario y te responderemos a la brevedad para confirmar la disponibilidad.</p>

        <!-- method="post": los datos personales no viajan en la URL. -->
        <form class="formulario-reserva" action="./reservas.html" method="post">

            <!-- Cada <label> se enlaza a su campo con for="id". -->
            <div class="campo">
                <label for="nombre">Nombre y apellido</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="fecha-desde">Fecha desde</label>
                <input type="date" id="fecha-desde" name="fecha_desde" required>
            </div>

            <div class="campo">
                <label for="fecha-hasta">Fecha hasta</label>
                <input type="date" id="fecha-hasta" name="fecha_hasta" required>
            </div>

            <div class="campo">
                <label for="comentario">Comentario</label>
                <textarea id="comentario" name="comentario" rows="5"></textarea>
            </div>

            <button type="submit" class="formulario-boton">Enviar reserva</button>
        </form>
    </main>

     <!-- Footer  -->
    <footer class="pie">
        <p>&copy; 2026 Retiro Sustentable &middot; San Javier, Traslasierras, Córdoba. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
